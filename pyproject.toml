[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gutsporepredict"
version = "4.0.0a1"
description = "Comparative genomics and evolutionary analysis of sporulation and germination potential in gut-associated bacteria."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Atsushi Hisatomi" }
]
keywords = [
    "comparative genomics",
    "sporulation",
    "germination",
    "gut microbiome",
    "GTDB",
    "MAG",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10"
]

[project.scripts]
gutsporepredict = "gutsporepredict.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP"
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
packages = ["gutsporepredict"]
mypy_path = "src"
